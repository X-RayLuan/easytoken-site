<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playground · EasyToken</title>
<meta name="description" content="Try any EasyToken model in the browser and copy the exact API request.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="playground">
<div id="site-header"></div>
<main class="wrap">
  <div class="page-head">
    <div class="eyebrow">Playground</div>
    <h1>Try a model.</h1>
    <p>Write a prompt, see the cost before you run it, and copy the request into your code.</p>
  </div>
  <div class="pg">
    <form class="surface pg-form" id="pg-form">
      <label class="field">Model
        <select class="input" id="model"></select>
      </label>
      <label class="field">Prompt
        <textarea class="input" id="prompt" required></textarea>
      </label>
      <label class="field" id="opt-wrap">Aspect ratio
        <select class="input" id="opt"></select>
      </label>
      <div class="pg-cost"><span class="muted">Cost per run</span><span class="num"><span class="muted" id="c-off-label"></span> <span class="muted" id="c-off"></span> <b id="c-ours"></b></span></div>
      <button class="btn btn-primary btn-block" id="run" type="submit">Run</button>
      <div class="demo-note small" id="demo-note">Preview mode. Runs here are simulated and free. <a href="signup.html">Create an account</a> to run real tasks.</div>
    </form>
    <div class="pg-out">
      <div class="surface result" id="result">Your output will appear here.</div>
      <div class="term-card">
        <div class="bar"><span>request.sh</span><button class="copy" type="button" data-copy="#code">Copy</button></div>
        <pre class="code" id="code"></pre>
      </div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
// Aspect ratio is the one option every video/image model shares; other params use defaults.
const OPTS = { video: [["16:9","16:9 wide"],["9:16","9:16 vertical"]], image: [["1:1","1:1 square"],["16:9","16:9 wide"],["9:16","9:16 vertical"]] };
const sel = $("#model");
sel.innerHTML = CATS.map(([k,l]) => `<optgroup label="${l}">${MODELS.filter(m => m.cat === k).map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("")}</optgroup>`).join("");
const want = new URLSearchParams(location.search).get("model");
if (want && modelById(want)) sel.value = want;
let live = !!Account.get();
api("/me").then(r => { live = !!r.user; if (r.user) $("#demo-note").innerHTML = `Signed in as ${esc(r.user.email)} · balance <b>${usd(r.user.balance_usd)}</b>. Runs are billed to your account; failures are free.`; else Account.clear(); }).catch(() => { live = false; });

function cur(){ return modelById(sel.value) }
function sync(){
  const m = cur();
  $("#prompt").value = $("#prompt").dataset.touched ? $("#prompt").value : (m.input?.prompt || m.input?.text || "Write a 15-second ad script for a coffee brand.");
  const opts = OPTS[m.cat];
  $("#opt-wrap").hidden = !opts;
  $("#opt").innerHTML = (opts || []).map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
  $("#c-off-label").textContent = OFF_LABEL + ":";
  $("#c-off").innerHTML = save(m) ? `<s>${offUsd(m)}</s>` : offUsd(m);
  $("#c-ours").textContent = m.chat ? `${usd(m.ours)} / 1M tok` : usd(m.ours);
  $("#code").innerHTML = snippet(m);
  $("#result").textContent = "Your output will appear here.";
}
sel.addEventListener("change", () => { delete $("#prompt").dataset.touched; sync(); history.replaceState(null, "", "?model=" + sel.value); });
$("#prompt").addEventListener("input", e => e.target.dataset.touched = "1");

function showResult(m, t){
  const u = t.result?.url, out = $("#result");
  if (t.status === "failed") { out.innerHTML = `<div class="small">Task failed: ${esc(t.error?.message || "unknown error")}<br>You were not charged.</div>`; return; }
  const media = m.cat === "video" ? `<video src="${esc(u)}" controls playsinline style="max-width:100%;max-height:520px;border-radius:8px"></video>`
    : m.cat === "image" ? `<img src="${esc(u)}" alt="Generated image" style="max-width:100%;max-height:520px;border-radius:8px">`
    : `<audio src="${esc(u)}" controls style="width:100%"></audio>`;
  out.innerHTML = `<div style="width:100%;display:grid;gap:10px;justify-items:center">${media}<div class="small">Billed ${usd(t.cost_usd)} · <a href="${esc(u)}" target="_blank" rel="noopener">open file</a> · ${esc(t.id)}</div></div>`;
}

async function runLive(m){
  const out = $("#result"), input = $("#opt-wrap").hidden ? {} : { aspect_ratio: $("#opt").value };
  if (m.chat) {
    out.innerHTML = `<div class="mono small">thinking…</div>`;
    const r = await api("/playground", { model: m.id, prompt: $("#prompt").value });
    out.innerHTML = `<div class="chat"></div>`; out.firstChild.textContent = r.choices?.[0]?.message?.content || "(empty reply)";
    return;
  }
  let t = await api("/playground", { model: m.id, prompt: $("#prompt").value, input });
  const started = Date.now();
  out.innerHTML = `<div style="width:100%;display:grid;justify-items:center"><div class="mono small">${esc(t.id)} · ${esc(m.id)} · est. ${esc(m.eta)}</div><div class="progress"><i></i></div><div class="small muted" id="pg-st">queued</div></div>`;
  while (t.status === "queued" || t.status === "running") {
    await new Promise(r => setTimeout(r, 4000));
    t = await api("/tasks/" + t.id);
    const secs = Math.round((Date.now() - started) / 1000);
    const bar = $(".progress i", out); if (bar) bar.style.width = Math.min(95, secs / (parseInt(m.eta.replace(/\D/g, "")) || 60) * 90) + "%";
    const st = $("#pg-st", out); if (st) st.textContent = `${t.status} · ${secs}s`;
  }
  showResult(m, t);
}

const SAMPLE = "Open on steam rising from a fresh cup.\nVO: \"Mornings are hard. Your coffee shouldn't be.\"\nCut to the pour, slow motion.\nVO: \"Roasted in small batches, delivered in 48 hours.\"\nEnd card: logo and \"First bag free.\"";
function runDemo(m){
  const out = $("#result"), btn = $("#run");
  if (m.chat) {
    out.innerHTML = `<div class="chat"></div>`; let i = 0;
    const t = setInterval(() => { out.firstChild.textContent = SAMPLE.slice(0, i += 4); if (i >= SAMPLE.length) { clearInterval(t); btn.disabled = false; } }, 18);
    return;
  }
  out.innerHTML = `<div style="width:100%;display:grid;justify-items:center"><div class="mono small">task queued · ${esc(m.id)} · est. ${esc(m.eta)}</div><div class="progress"><i></i></div></div>`;
  let p = 0;
  const t = setInterval(() => {
    p += 7; $(".progress i", out).style.width = Math.min(p, 100) + "%";
    if (p >= 100) {
      clearInterval(t); btn.disabled = false;
      const shape = m.cat === "image" ? "frame square" : "frame";
      const label = m.cat === "audio" ? "♪ audio.mp3 · preview" : m.cat === "video" ? "▶ output.mp4 · preview" : "output.png · preview";
      out.innerHTML = `<div style="width:100%;display:grid;gap:12px;justify-items:center"><div class="${shape}">${label}<br>${esc($("#prompt").value.slice(0,80))}</div><div class="small">Simulated result. <a href="signup.html">Create an account</a> to run it for real: ${usd(m.ours)}, $0 if it fails.</div></div>`;
    }
  }, 120);
}

$("#pg-form").addEventListener("submit", async e => {
  e.preventDefault();
  const m = cur(), btn = $("#run");
  if (!$("#prompt").value.trim()) { $("#result").textContent = "Add a prompt before running."; return; }
  btn.disabled = true;
  if (!live) return runDemo(m);
  try { await runLive(m); }
  catch (err) { $("#result").innerHTML = `<div class="small">${esc(err.message)}${err.code === "insufficient_credits" ? ` <a href="dashboard.html#billing">Add credits</a>` : ""}</div>`; }
  btn.disabled = false;
});
sync();
</script>
</body>
</html>
