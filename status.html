<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Status · EasyToken</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="status">
<div id="site-header"></div>
<main class="wrap">
  <div class="page-head"><div class="eyebrow">System status</div><h1>All systems operational.</h1>
  <p>Uptime over the last 90 days for the API and each model family. Each bar is one day.</p></div>
  <div class="surface" id="svcs"></div>
  <p class="note">Sample data shown until live monitoring is connected.</p>
  <div style="height:80px"></div>
</main>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
const SVCS = [["API gateway",99.99],["Dashboard",99.98],["Video models",99.71],["Image models",99.93],["Audio models",99.95],["Chat models",99.96],["Webhooks",99.97]];
$("#svcs").innerHTML = SVCS.map(([n,u],j) => `<div class="svc"><b>${n}</b><div class="bars" aria-hidden="true">${Array.from({length:90},(_,i)=>`<i class="${(i*7+j*13)%97===3&&u<99.95?"warn":""}"></i>`).join("")}</div><span class="badge ok">${u}%</span></div>`).join("");
</script>
</body>
</html>
